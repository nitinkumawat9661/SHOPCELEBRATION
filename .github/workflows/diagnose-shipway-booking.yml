name: Diagnose Shipway Booking

on:
  push:
    branches:
      - ops/diagnose-shipway-booking

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/key"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/key" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/key" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Inspect Shipway failures
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_ROOT=/var/www/celebration
          ACTIVE="$(readlink -f "$APP_ROOT/current")"
          ENV_FILE="$APP_ROOT/shared/.env.production"
          set -a
          . "$ENV_FILE"
          set +a
          echo "ACTIVE_RELEASE=$ACTIVE"
          for k in SHIPWAY_EMAIL SHIPWAY_LICENSE_KEY SHIPWAY_WAREHOUSE_ID SHIPWAY_RETURN_WAREHOUSE_ID; do
            if [ -n "${!k:-}" ]; then echo "$k=SET"; else echo "$k=MISSING"; fi
          done

          echo "SHIPWAY_LOGS_BEGIN"
          for LOG in /home/$USER/.pm2/logs/celebration-site-error.log /home/$USER/.pm2/logs/celebration-site-out.log; do
            if [ -f "$LOG" ]; then
              tail -n 1200 "$LOG" | grep -Ei 'shipway|auto-book|shipping.*failed|SHIPWAY_' | tail -n 120 || true
            fi
          done
          echo "SHIPWAY_LOGS_END"

          echo "REAL_APP_RETRY_BEGIN"
          ORDER_ID="CEL-261004-D219ABD352917C24"
          COOKIE="$(node -e 'const crypto=require("crypto");const exp=Math.floor(Date.now()/1000)+900;const payload=Buffer.from(JSON.stringify({exp,version:process.env.ADMIN_SESSION_VERSION})).toString("base64url");const sig=crypto.createHmac("sha256",process.env.ADMIN_SESSION_SECRET).update(payload).digest("base64url");process.stdout.write(payload+"."+sig)')"
          RETRY_BODY="$(mktemp)"
          RETRY_CODE="$(curl --silent --show-error --max-time 30 --output "$RETRY_BODY" --write-out '%{http_code}' \
            -X POST "https://shopcelebration.in/api/admin/orders/$ORDER_ID/shipping" \
            -H 'Origin: https://shopcelebration.in' \
            -H 'Content-Type: application/json' \
            -H "Cookie: celebration_admin=$COOKIE" \
            --data '{"mode":"shipway"}')"
          echo "REAL_APP_RETRY_HTTP=$RETRY_CODE"
          node -e 'const fs=require("fs");let d;try{d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{console.log("REAL_APP_RETRY_JSON=INVALID");process.exit(0)};for(const k of ["ok","code","error","status","awb","carrierId","labelUrl"])if(d[k]!==undefined)console.log("REAL_APP_RETRY "+k+"="+String(d[k]))' "$RETRY_BODY"
          rm -f "$RETRY_BODY"
          sleep 2
          echo "REAL_APP_RETRY_LOGS"
          tail -n 300 /home/$USER/.pm2/logs/celebration-site-error.log | grep -A10 -B2 -Ei 'shipway-booking-response|account-auto-book-shipway|customer-orders-auto-book' | tail -n 80 || true
          echo "REAL_APP_RETRY_END"

          echo "SHIPWAY_SERVICEABILITY_BEGIN"
          SVC="$(mktemp)"
          SCODE="$(curl --silent --show-error --location --max-time 20 --user "$SHIPWAY_EMAIL:$SHIPWAY_LICENSE_KEY" --output "$SVC" --write-out '%{http_code}' 'https://app.shipway.com/api/pincodeserviceable?pincode=332001&payment_type=P')"
          echo "SHIPWAY_SERVICEABILITY_HTTP=$SCODE"
          node -e 'const fs=require("fs");let d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));function w(x){if(Array.isArray(x)){for(const v of x.slice(0,30))w(v);return}if(!x||typeof x!=="object")return;const id=x.carrier_id??x.id;const name=x.carrier_title??x.name;const pay=x.payment_type;if(id!==undefined||name!==undefined)console.log("SHIPWAY_OPTION",JSON.stringify({id:id??null,name:name??null,payment:pay??null}));for(const v of Object.values(x))if(v&&typeof v==="object")w(v)}w(d)' "$SVC"
          rm -f "$SVC"
          echo "SHIPWAY_SERVICEABILITY_END"

          echo "SHIPWAY_WAREHOUSES_BEGIN"
          WARE="$(mktemp)"
          WCODE="$(curl --silent --show-error --location --max-time 20 --user "$SHIPWAY_EMAIL:$SHIPWAY_LICENSE_KEY" --header 'Content-Type: application/json' --output "$WARE" --write-out '%{http_code}' 'https://app.shipway.com/api/getwarehouses')"
          echo "SHIPWAY_WAREHOUSES_HTTP=$WCODE"
          node -e 'const fs=require("fs");let d;try{d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{console.log("WAREHOUSE_JSON=INVALID");process.exit(0)};function w(x){if(Array.isArray(x)){for(const v of x)w(v);return}if(!x||typeof x!=="object")return;const id=x.warehouse_id??x.warehouseid??x.id;const title=x.title??x.name??x.warehouse_name;const city=x.city;const pin=x.pincode??x.zipcode;if(id!==undefined)console.log("WAREHOUSE",JSON.stringify({id:String(id),title:title??null,city:city??null,pincode:pin??null}));for(const v of Object.values(x))if(v&&typeof v==="object")w(v)}w(d)' "$WARE"
          rm -f "$WARE"
          echo "SHIPWAY_WAREHOUSES_END"

          for ORDER_ID in CEL-261004-D219ABD352917C24 CEL-261005-F32ED64D032E641A; do
            echo "SHIPWAY_ORDER_LOOKUP=$ORDER_ID"
            BODY="$(mktemp)"
            CODE="$(curl --silent --show-error --location --max-time 20 --user "$SHIPWAY_EMAIL:$SHIPWAY_LICENSE_KEY" --header 'Content-Type: application/json' --output "$BODY" --write-out '%{http_code}' "https://app.shipway.com/api/getorders?orderid=$ORDER_ID&page=1")"
            echo "SHIPWAY_LOOKUP_HTTP=$CODE"
            node -e 'const fs=require("fs");let d;try{d=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))}catch{console.log("SHIPWAY_LOOKUP_JSON=INVALID");process.exit(0)};const keys=new Set(["order_id","orderid","awb","awb_number","carrier_id","carrier","status","shipment_status","message","success","error"]);function w(x){if(Array.isArray(x)){for(const v of x.slice(0,5))w(v);return}if(!x||typeof x!=="object")return;for(const [k,v] of Object.entries(x)){if(keys.has(k.toLowerCase())&&typeof v!=="object")console.log("SHIPWAY_FIELD "+k+"="+String(v));if(v&&typeof v==="object")w(v)}}w(d)' "$BODY"
            rm -f "$BODY"
          done

          cd "$ACTIVE"
          node -e 'const {Client}=require("pg");(async()=>{const ssl=String(process.env.DATABASE_SSL_MODE||"").toLowerCase()==="require"?{rejectUnauthorized:false}:undefined;const c=new Client({connectionString:process.env.DATABASE_URL,ssl});try{await c.connect();const r=await c.query("SELECT public_id,status,shipping_provider,shipping_tracking_number,shipping_carrier_id,shipping_booked_at,customer_approved_at,address,city,state,pincode,phone,updated_at FROM orders ORDER BY updated_at DESC LIMIT 8");for(const x of r.rows){console.log("ORDER",JSON.stringify({publicId:x.public_id,status:x.status,provider:x.shipping_provider,tracking:x.shipping_tracking_number,carrier:x.shipping_carrier_id,bookedAt:x.shipping_booked_at,approvedAt:x.customer_approved_at,city:x.city,state:x.state,pincode:x.pincode,phone:x.phone?String(x.phone).replace(/.(?=.{4})/g,"*"):null,updatedAt:x.updated_at}))}}catch(e){console.log("DB_ERROR",e.code||e.message)}finally{try{await c.end()}catch{}}})()'
          REMOTE
