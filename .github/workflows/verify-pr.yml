name: Verify Celebration PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          # TEMPORARY PR-only lockfile generator; remove after copying verified lock.
          npm install --package-lock-only --save-exact next@16.4.3
          node -e "const fs=require('fs'); const s=fs.readFileSync('package-lock.json').toString('base64'); for(let i=0,j=0;i<s.length;i+=3000,j++) console.log('SEO_LOCK_PART_'+String(j).padStart(3,'0')+'='+s.slice(i,i+3000));"
          npm ci
          npm run audit
          # Build the exact combined branch before touching the VPS.
          NEXT_PUBLIC_SITE_INDEXABLE=false npm run build
          # Keep the security gate, but run type/build checks first so existing
          # dependency advisories do not hide new application regressions.
          npm audit --omit=dev
