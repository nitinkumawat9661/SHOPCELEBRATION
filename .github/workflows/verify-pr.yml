name: Verify Celebration PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out proposed revision
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run audit
          # Build the exact combined branch with production-indexable metadata.
          # The SEO unit audit separately checks NEXT_PUBLIC_SITE_INDEXABLE=false.
          NEXT_PUBLIC_SITE_INDEXABLE=true npm run build
          # Keep the security gate, but run type/build checks first so existing
          # dependency advisories do not hide new application regressions.
          npm audit --omit=dev

  live-seo-baseline:
    # Temporary read-only live-site diagnostics, performed from GitHub's runner;
    # no VPS credentials, production writes, or deployment are involved.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public production SEO headers and responses
        shell: bash
        run: |
          set -u
          for path in "/" "/robots.txt" "/sitemap.xml" "/jewelry" "/curated-hampers" "/jewelry/necklace-001" "/admin"; do
            url="https://shopcelebration.in${path}"
            headers="$(mktemp)"
            body="$(mktemp)"
            echo "===== SEO PROBE path=${path} ====="
            code="$(curl --silent --show-error --location --max-time 16 --connect-timeout 8 --dump-header "${headers}" --output "${body}" --write-out '%{http_code}' "${url}")"
            rc=$?
            echo "http_status=${code} curl_exit=${rc} body_bytes=$(wc -c < "${body}")"
            grep -iE '^(HTTP/|x-robots-tag:|content-type:|location:|server:|cache-control:)' "${headers}" || true
            if [ "${path}" = "/robots.txt" ]; then
              echo "robots_start"
              head -c 3200 "${body}"
              echo
              echo "robots_end"
            elif [ "${path}" = "/sitemap.xml" ]; then
              echo "sitemap_start"
              head -c 2200 "${body}"
              echo
              echo "sitemap_end"
            elif [ "${path}" = "/" ] || [ "${path}" = "/jewelry" ]; then
              grep -o -i -E '<meta[^>]+name="robots"[^>]*>|<link[^>]+rel="canonical"[^>]*>|<title>[^<]*</title>' "${body}" | head -10 || true
            fi
            rm -f "${headers}" "${body}"
          done

      - name: Verify representative live SKU SEO and sitemap counts
        shell: bash
        run: |
          set -u
          xml="$(mktemp)"
          curl -fsSL --max-time 20 https://shopcelebration.in/sitemap.xml -o "${xml}"
          echo "total_loc_count=$(grep -o '<loc>' "${xml}" | wc -l)"
          echo "unique_loc_count=$(grep -o '<loc>[^<]*</loc>' "${xml}" | sort -u | wc -l)"
          echo "product_loc_count=$(grep -o '<loc>https://shopcelebration.in/jewelry/[^<]*</loc>' "${xml}" | wc -l)"
          echo "sitemap_category_count=$(grep -o '<loc>https://shopcelebration.in/jewelry/category/[^<]*</loc>' "${xml}" | wc -l)"
          for path in "/jewelry/celebration-necklace-001" "/jewelry/celebration-necklace-020" "/jewelry?category=Trending%20Necklaces" "/cart" "/jewelry/category/trending-necklaces"; do
            echo "===== META CHECK ${path} ====="
            hdr="$(mktemp)"
            body="$(mktemp)"
            code="$(curl --silent --show-error --max-time 18 --location --dump-header "${hdr}" --output "${body}" --write-out '%{http_code}' "https://shopcelebration.in${path}")"
            rc=$?
            echo "http_status=${code} curl_exit=${rc}"
            grep -iE '^(HTTP/|x-robots-tag:|location:)' "${hdr}" || true
            grep -o -i -E '<meta[^>]+name="robots"[^>]*>|<link[^>]+rel="canonical"[^>]*>|<title>[^<]*</title>' "${body}" | head -8 || true
            rm -f "${hdr}" "${body}"
          done
          rm -f "${xml}"
