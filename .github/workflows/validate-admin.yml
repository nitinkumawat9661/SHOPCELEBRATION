name: Validate Celebration Admin

on:
  push:
    branches:
      - feat/systematic-admin-panel

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify source
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test ! -e .env
          test ! -e .env.production
          npm ci
          npm audit --omit=dev
          npm run audit
          npm run typecheck
          npm run build
