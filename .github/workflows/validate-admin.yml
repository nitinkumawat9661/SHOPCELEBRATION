name: Validate Celebration Admin

on:
  push:
    branches:
      - feat/systematic-admin-panel

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Security audit
        run: npm audit --omit=dev

      - name: Source audit
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
