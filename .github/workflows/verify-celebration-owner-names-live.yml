          assert.equal(expected.length, 89)
          assert.equal(new Set(expected.map(p => p.sku)).size, 89)

          let response
          for (let attempt = 1; attempt <= 4; attempt++) {
            try {
              response = await fetch('https://shopcelebration.in/api/catalog?owner_name_audit=20261016_' + attempt, {
                headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
                signal: AbortSignal.timeout(20000)
              })
              if (response.ok) break
              throw new Error('HTTP ' + response.status)
            } catch (error) {
              console.log('Live catalog read attempt ' + attempt + ': ' + error.message)
              if (attempt === 4) throw error
              await new Promise(resolve => setTimeout(resolve, attempt * 1800))
            }
          }
          const body = await response.json()
          if (body.ok !== true || !Array.isArray(body.catalog?.products)) {
            throw new Error('Live endpoint did not return a database-backed product catalog')
          }
          const actualProducts = body.catalog.products
          const actualBySku = new Map(actualProducts.map(p => [p.id, p]))
          const diffs = []
          let namesCorrect = 0, imagesCorrect = 0, altCorrect = 0
          for (const want of expected) {
            const got = actualBySku.get(want.sku)
            if (!got) {
              diffs.push({ sku: want.sku, issue: 'SKU_MISSING' })
              continue
            }
            if (got.name !== want.name) {
              diffs.push({ sku: want.sku, issue: 'NAME_MISMATCH', expected: want.name, actual: got.name })
            } else namesCorrect++
            if (got.imageUrl !== want.image) {
              diffs.push({ sku: want.sku, issue: 'PRIMARY_IMAGE_CHANGED', expected: want.image, actual: got.imageUrl })
            } else imagesCorrect++
            if (got.images?.[0]?.url !== want.image) {
              diffs.push({ sku: want.sku, issue: 'GALLERY_IMAGE_CHANGED', expected: want.image, actual: got.images?.[0]?.url })
            }
            if (got.images?.[0]?.alt === want.name) altCorrect++
          }
          const extra = actualProducts.filter(p => !expected.some(w => w.sku === p.id))
          const duplicateIds = actualProducts.length - new Set(actualProducts.map(p => p.id)).size
          const report = {
            checkedAt: new Date().toISOString(),
            liveVersion: body.version,
            expectedReviewedProducts: 89,
            liveProductCount: actualProducts.length,
            checkedNamesMatching: namesCorrect,
            checkedImageLinksMatching: imagesCorrect,
            checkedPrimaryAltsMatching: altCorrect,
            extraLiveProducts: extra.map(p => p.id),
            duplicateIds,
            mismatches: diffs
          }
          console.log('OWNER_REVIEW_LIVE_CATALOG_AUDIT=' + JSON.stringify(report, null, 2))
          if (diffs.length || duplicateIds || namesCorrect !== 89 || imagesCorrect !== 89) {
            console.error('FAIL: live catalog does not match the owner-approved source. No write performed.')
            process.exitCode = 1
          } else {
            console.log('PASS: all 89 owner-approved names and all 89 SKU-owned hero/gallery images match the live catalog.')
          }
          NODE
