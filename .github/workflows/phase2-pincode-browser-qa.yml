name: Celebration Phase 2 Product PIN Browser QA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Celebration Production"]
    types: [completed]

permissions:
  contents: read

jobs:
  product-pincode:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Prepare Chrome
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Mock provider response and test product PIN check in real Chrome
        env:
          BASE_URL: https://shopcelebration.in
        run: node scripts/audit-phase2-pincode-live-browser.mjs
      - name: Save screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-product-pincode-${{ github.run_id }}
          path: artifacts/phase2-pincode/
          if-no-files-found: warn
          retention-days: 14
