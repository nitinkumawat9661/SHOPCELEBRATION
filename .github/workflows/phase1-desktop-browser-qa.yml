name: Celebration Phase 1 Desktop Browser QA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Celebration Production"]
    types: [completed]

permissions:
  contents: read

jobs:
  actual-desktop-homepage:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out desktop QA
        uses: actions/checkout@v5
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Prepare installed Chrome
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Read-only desktop geometry and screenshot QA
        shell: bash
        env:
          BASE_URL: https://shopcelebration.in/
        run: |
          set -euo pipefail
          node scripts/audit-phase1-live-home-desktop.mjs
      - name: Preserve four desktop layouts and machine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-home-desktop-screenshots-${{ github.run_id }}
          path: artifacts/phase1-home-desktop/
          if-no-files-found: warn
          retention-days: 14
