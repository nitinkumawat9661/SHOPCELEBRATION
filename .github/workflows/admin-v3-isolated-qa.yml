name: Admin V3 Isolated Integration QA

on:
  push:
    branches:
      - feat/admin-v3-phase1-20261017
    paths:
      - '.github/workflows/admin-v3-isolated-qa.yml'
      - 'features/admin/v3/**'
      - 'features/admin/AdminCatalogManager.tsx'
      - 'features/admin/AdminCampaigns.tsx'
      - 'features/admin/AdminSelfBuildManager.tsx'
      - 'features/admin/AdminSelfBuildCapacity.tsx'
      - 'lib/server/admin-*.ts'
      - 'lib/server/store-settings.ts'
      - 'lib/domain/admin-stock-adjustment.ts'
      - 'app/api/admin/**'
      - 'app/admin/v3/**'
      - 'styles/admin-v3-*.css'
      - 'scripts/test-admin-v3-*.mjs'
      - 'scripts/browser-admin-v3-qa.mjs'
      - 'db/migrations/109_admin_inventory_adjustment_history.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celebration-admin-v3-isolated-qa
  cancel-in-progress: true

jobs:
  quality:
    name: Static regression, typecheck, audit and nonindexable build
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_PUBLIC_SITE_INDEXABLE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Check out exact development commit (never main)
        uses: actions/checkout@v5
      - name: Assert isolated development branch and no production settings
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'feat/admin-v3-phase1-20261017'
          test ! -e .env
          test ! -e .env.production
          test ! -e .env.local
      - name: Node 24 with cached npm packages
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test every Admin V3 milestone contract
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            scripts/test-admin-v3-phase1.mjs \
            scripts/test-admin-v3-phase2.mjs \
            scripts/test-admin-v3-functional-integration.mjs \
            scripts/test-admin-v3-inventory.mjs \
            scripts/test-admin-v3-hampers.mjs \
            scripts/test-admin-v3-offers.mjs \
            scripts/test-admin-v3-customers.mjs \
            scripts/test-admin-v3-analytics.mjs \
            scripts/test-admin-v3-reviews.mjs \
            scripts/test-admin-v3-settings.mjs; do
            echo "=== $test ==="
            node "$test"
          done
      - name: Full project TypeScript check
        run: npm run typecheck
      - name: Legacy storefront and admin regression audit
        run: npm run audit
      - name: Build candidate without indexing or deployment
        run: npm run build

  postgres-integration:
    name: Disposable PostgreSQL 16 domain integration
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin-v3-only-disposable-test
          POSTGRES_DB: celebration_v3_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d celebration_v3_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:admin-v3-only-disposable-test@127.0.0.1:5432/celebration_v3_qa
      DATABASE_SSL_MODE: disable
      NEXT_PUBLIC_SITE_INDEXABLE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies for disposable local tests only
        run: npm ci
      - name: Execute migrations and V3 database integration on ephemeral local DB
        run: node scripts/test-admin-v3-postgres.mjs

  browser-layout:
    name: Real Chromium synthetic-only 10-screen V3 responsive QA
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      NEXT_PUBLIC_SITE_INDEXABLE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked app and ephemeral Chromium automation
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Create NEVER-COMMITTED synthetic QA page on runner only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/admin-v3-qa-only
          mkdir -p app/admin-v3-qa-only
          cat > app/admin-v3-qa-only/page.tsx <<'TSX'
          import { AdminDashboardV3 } from '../../features/admin/v3/AdminDashboardV3'
          import '../../styles/admin.css'
          import '../../styles/admin-v2.css'
          import '../../styles/admin-systematic.css'
          import '../../styles/admin-shell.css'
          import '../../styles/admin-individual-sales.css'
          import '../../styles/admin-catalog-polish.css'
          import '../../styles/admin-reservation-review.css'
          import '../../styles/admin-v3.css'
          import '../../styles/admin-v3-details.css'
          import '../../styles/admin-v3-inventory.css'
          import '../../styles/admin-v3-hampers.css'
          import '../../styles/admin-v3-offers.css'
          import '../../styles/admin-v3-customers.css'
          import '../../styles/admin-v3-analytics.css'
          import '../../styles/admin-v3-reviews.css'
          import '../../styles/admin-v3-settings.css'
          import '../../styles/admin-self-build-20261013.css'
          export const dynamic = 'force-dynamic'
          export const metadata = { robots: { index: false, follow: false } }
          export default function DisposableV3BrowserQA() {
            return <AdminDashboardV3 />
          }
          TSX
      - name: Build NON-DEPLOYED ephemeral UI candidate
        run: npm run build
      - name: Serve locally and verify all 10 screens at 4 widths
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export CHROME_BIN
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3288 > /tmp/admin-v3-qa-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3288/admin-v3-qa-only -o /dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            tail -n 160 /tmp/admin-v3-qa-next.log
            exit 1
          fi
          ADMIN_V3_QA_URL=http://127.0.0.1:3288/admin-v3-qa-only node scripts/browser-admin-v3-qa.mjs
      - name: Save synthetic layout proof (no user records)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-v3-synthetic-chromium-qa-${{ github.run_id }}
          path: artifacts/admin-v3-browser
          if-no-files-found: warn
          retention-days: 7
