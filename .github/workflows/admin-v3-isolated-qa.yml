name: Admin V3 Isolated Integration QA

on:
  push:
    branches:
      - feat/admin-v3-phase1-20261017
    paths:
      - '.github/workflows/admin-v3-isolated-qa.yml'
      - 'features/admin/v3/**'
      - 'features/admin/AdminCatalogManager.tsx'
      - 'features/admin/AdminCampaigns.tsx'
      - 'features/admin/AdminSelfBuildManager.tsx'
      - 'features/admin/AdminSelfBuildCapacity.tsx'
      - 'lib/server/admin-*.ts'
      - 'lib/server/store-settings.ts'
      - 'lib/domain/admin-stock-adjustment.ts'
      - 'app/api/admin/**'
      - 'app/admin/v3/**'
      - 'styles/admin-v3-*.css'
      - 'scripts/test-admin-v3-*.mjs'
      - 'scripts/browser-admin-v3-qa.mjs'
      - 'scripts/admin-v3-*.mjs'
      - 'scripts/browser-admin-v3-real-http-staging.mjs'
      - 'db/migrations/109_admin_inventory_adjustment_history.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: celebration-admin-v3-isolated-qa
  cancel-in-progress: true

jobs:
  quality:
    name: Static regression, typecheck, audit and nonindexable build
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      NEXT_PUBLIC_SITE_INDEXABLE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Check out exact development commit (never main)
        uses: actions/checkout@v5
      - name: Assert isolated development branch and no production settings
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'feat/admin-v3-phase1-20261017'
          test ! -e .env
          test ! -e .env.production
          test ! -e .env.local
      - name: Node 24 with cached npm packages
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test every Admin V3 milestone contract
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            scripts/test-admin-v3-phase1.mjs \
            scripts/test-admin-v3-phase2.mjs \
            scripts/test-admin-v3-functional-integration.mjs \
            scripts/test-admin-v3-inventory.mjs \
            scripts/test-admin-v3-hampers.mjs \
            scripts/test-admin-v3-offers.mjs \
            scripts/test-admin-v3-customers.mjs \
            scripts/test-admin-v3-analytics.mjs \
            scripts/test-admin-v3-reviews.mjs \
            scripts/test-admin-v3-settings.mjs; do
            echo "=== $test ==="
            node "$test"
          done
      - name: Verify isolation guard and 14 refusal cases
        run: node scripts/admin-v3-staging-preflight.test.mjs
      - name: Full project TypeScript check
        run: npm run typecheck
      - name: Legacy storefront and admin regression audit
        run: npm run audit
      - name: Build candidate without indexing or deployment
        run: npm run build

  postgres-integration:
    name: Disposable PostgreSQL 16 domain integration
    runs-on: ubuntu-latest
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: admin-v3-only-disposable-test
          POSTGRES_DB: celebration_v3_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d celebration_v3_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:admin-v3-only-disposable-test@127.0.0.1:5432/celebration_v3_qa
      DATABASE_SSL_MODE: disable
      NEXT_PUBLIC_SITE_INDEXABLE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies for disposable local tests only
        run: npm ci
      - name: Execute migrations and V3 database integration on ephemeral local DB
        run: node scripts/test-admin-v3-postgres.mjs

  browser-layout:
    name: Real Chromium synthetic-only 10-screen V3 responsive QA
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      NEXT_PUBLIC_SITE_INDEXABLE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked app and ephemeral Chromium automation
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Create NEVER-COMMITTED synthetic QA page on runner only
        shell: bash
        run: |
          set -euo pipefail
          test ! -e app/admin-v3-qa-only
          mkdir -p app/admin-v3-qa-only
          cat > app/admin-v3-qa-only/page.tsx <<'TSX'
          import { AdminDashboardV3 } from '../../features/admin/v3/AdminDashboardV3'
          import '../../styles/admin.css'
          import '../../styles/admin-v2.css'
          import '../../styles/admin-systematic.css'
          import '../../styles/admin-shell.css'
          import '../../styles/admin-individual-sales.css'
          import '../../styles/admin-catalog-polish.css'
          import '../../styles/admin-reservation-review.css'
          import '../../styles/admin-v3.css'
          import '../../styles/admin-v3-details.css'
          import '../../styles/admin-v3-inventory.css'
          import '../../styles/admin-v3-hampers.css'
          import '../../styles/admin-v3-offers.css'
          import '../../styles/admin-v3-customers.css'
          import '../../styles/admin-v3-analytics.css'
          import '../../styles/admin-v3-reviews.css'
          import '../../styles/admin-v3-settings.css'
          import '../../styles/admin-self-build-20261013.css'
          export const dynamic = 'force-dynamic'
          export const metadata = { robots: { index: false, follow: false } }
          export default function DisposableV3BrowserQA() {
            return <AdminDashboardV3 />
          }
          TSX
      - name: Build NON-DEPLOYED ephemeral UI candidate
        run: npm run build
      - name: Serve locally and verify all 10 screens at 4 widths
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export CHROME_BIN
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3288 > /tmp/admin-v3-qa-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 5 http://127.0.0.1:3288/admin-v3-qa-only -o /dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            tail -n 160 /tmp/admin-v3-qa-next.log
            exit 1
          fi
          ADMIN_V3_QA_URL=http://127.0.0.1:3288/admin-v3-qa-only node scripts/browser-admin-v3-qa.mjs
      - name: Save synthetic layout proof (no user records)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-v3-synthetic-chromium-qa-${{ github.run_id }}
          path: artifacts/admin-v3-browser
          if-no-files-found: warn
          retention-days: 7

  ephemeral-private-staging:
    permissions:
      contents: read
      issues: write
    name: Real passkey + HTTP on disposable isolated PostgreSQL (no VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: celebration_v3_staging
          POSTGRES_PASSWORD: ci-disposable-local-only
          POSTGRES_DB: celebration_v3_staging
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U celebration_v3_staging -d celebration_v3_staging"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_V3_STAGING: ephemeral-ci
      NEXT_PUBLIC_SITE_INDEXABLE: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
      APP_BASE_URL: http://localhost:3288
      DATABASE_URL: postgresql://celebration_v3_staging:ci-disposable-local-only@127.0.0.1:5432/celebration_v3_staging
      DATABASE_SSL_MODE: disable
    steps:
      - uses: actions/checkout@v5
      - name: Assert no production files and exact trusted development ref
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'feat/admin-v3-phase1-20261017'
          test ! -e .env
          test ! -e .env.production
          test ! -e .env.local
          test ! -e /var/www/celebration
          for key in CASHFREE_APP_ID CASHFREE_SECRET_KEY SHIPWAY_LICENSE_KEY TELEGRAM_BOT_TOKEN R2_SECRET_ACCESS_KEY VPS_SSH_PRIVATE_KEY; do
            test -z "${!key:-}" || { echo "Unexpected external integration credential variable" >&2; exit 1; }
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate ONLY runner-local ephemeral bootstrap credentials
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE' >> "$GITHUB_ENV"
          const { randomBytes, scryptSync } = require('node:crypto')
          const hex = n => randomBytes(n).toString('hex')
          const pwd = hex(20)
          const salt = randomBytes(16)
          const digest = scryptSync(pwd, salt, 64, {N:16384,r:8,p:1,maxmem:67108864})
          for (const [key,value] of Object.entries({
            ADMIN_V3_TEST_PASSWORD: pwd,
            ADMIN_PASSWORD_SCRYPT: salt.toString('hex') + ':' + digest.toString('hex'),
            ADMIN_SESSION_SECRET: hex(32),
            ADMIN_SESSION_VERSION: hex(16),
            TRACKING_TOKEN_SECRET: hex(32),
            PASSWORD_RESET_SECRET: hex(32)
          })) process.stdout.write(key + '=' + value + '\n')
          NODE
      - name: Install locked dependencies and virtual WebAuthn browser driver
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Apply full migrations to dedicated throwaway staging database ONLY
        run: |
          set -euo pipefail
          node scripts/migrate.mjs
          node scripts/admin-v3-ephemeral-stage-seed.mjs
      - name: Build application for REAL private HTTP staging, no deployment
        run: npm run build
      - name: Serve on GitHub runner loopback and test real authentication / writes
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          export CHROME_BIN
          ./node_modules/.bin/next start -H 127.0.0.1 -p 3288 > /tmp/admin-v3-real-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 60); do
            if curl -fsS --max-time 3 http://127.0.0.1:3288/api/health -o /dev/null; then READY=1; break; fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            tail -n 100 /tmp/admin-v3-real-http.log
            exit 1
          fi
          node scripts/browser-admin-v3-real-http-staging.mjs
      - name: Preserve sanitized ephemeral staging results (never passkeys or secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-v3-real-http-staging-${{ github.run_id }}
          path: artifacts/admin-v3-real-http
          if-no-files-found: warn
          retention-days: 7

      - name: Record ephemeral staging outcome in GitHub issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          gh issue comment 217 --repo nitinkumawat9661/SHOPCELEBRATION \\
            --body "Admin V3 isolated REAL HTTP + WebAuthn + Postgres staging job: **${OUTCOME}**. Run: https://github.com/nitinkumawat9661/SHOPCELEBRATION/actions/runs/${GITHUB_RUN_ID}. Commit: \`${GITHUB_SHA}\`. This is disposable CI, **NOT deployed to the VPS or production**."
