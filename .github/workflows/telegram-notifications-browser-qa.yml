name: Celebration Telegram Notification Center Browser QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/audit-notifications-browser.mjs'
      - '.github/workflows/telegram-notifications-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notifications-mock-browser:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Chromium harness
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Browser QA at 320 / 390 / 768 / 1280 and mock buyer isolation
        env:
          BASE_URL: https://shopcelebration.in
        run: node scripts/audit-notifications-browser.mjs
      - name: Save inbox screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: celebration-notification-inbox-${{ github.run_id }}
          path: artifacts/telegram-inbox/
          if-no-files-found: warn
          retention-days: 14
