name: Telegram Customer Messaging and Isolated PostgreSQL QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/account/orders/**'
      - 'app/api/integrations/telegram/**'
      - 'db/migrations/100_telegram_notification_outbox.sql'
      - 'db/migrations/101_telegram_order_messaging_and_courier.sql'
      - 'db/migrations/102_telegram_courier_watch.sql'
      - 'db/migrations/103_telegram_customer_two_way_chat.sql'
      - 'lib/server/orders/self-build-create.ts'
      - 'lib/server/self-build-payment-settlement.ts'
      - 'lib/server/self-build-reservations.ts'
      - 'lib/server/orders/create.ts'
      - 'scripts/test-order-integration.mjs'
      - 'features/account/**'
      - 'lib/server/telegram-order-messages.ts'
      - 'scripts/test-telegram-*.mjs'
      - 'scripts/test-order-integration.mjs'
      - '.github/workflows/telegram-isolated-postgres-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-only-telegram-qa
          POSTGRES_DB: celebration_individual_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      TEST_DATABASE_URL: postgresql://postgres:disposable-only-telegram-qa@127.0.0.1:5432/celebration_individual_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install and verify Telegram source contracts
        run: |
          set -euo pipefail
          npm ci
          node scripts/test-telegram-backend.mjs
          node scripts/test-telegram-customer-ui.mjs
      - name: Run destructive integration tests ONLY against isolated CI database
        run: |
          set -euo pipefail
          node scripts/test-order-integration.mjs
