name: Private Actions Runner Probe

on:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-private-celebration.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe runner
        run: echo PRIVATE_ACTIONS_RUNNER_OK
