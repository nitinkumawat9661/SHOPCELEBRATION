name: Bootstrap Private Celebration Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/bootstrap-private-celebration.yml]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out private target
        uses: actions/checkout@v5

      - name: Copy Celebration source only
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nitinkumawat9661/trustfirst-client-portal.git /tmp/source
          test -f /tmp/source/celebration-site/package.json
          rsync -a \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.next' \
            --exclude='node_modules' \
            /tmp/source/celebration-site/ ./
          test -f package.json
          test -f package-lock.json
          test ! -e .env
          test ! -e .env.production

      - name: Validate migrated private source
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit --omit=dev
          npm run audit
          npm run typecheck
          npm run build

      - name: Commit private source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: bootstrap Celebration private source"
          git push origin HEAD:main
