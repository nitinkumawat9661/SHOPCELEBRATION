name: Rehost Celebration Product Images

on:
  workflow_run:
    workflows:
      - Deploy Celebration Production
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: celebration-image-rehost
  cancel-in-progress: false

jobs:
  rehost:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Rehost Celebration images')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || { echo "Missing required value: $name" >&2; exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/celebration_rehost"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/celebration_rehost" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/celebration_rehost" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Rehost and verify media before changing catalog
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/celebration_rehost" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOYED_SHA" <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "nitin"
          ACTIVE="$(readlink -f /var/www/celebration/current)"
          SHORT="$(printf '%s' "$1" | cut -c1-12)"
          test "$ACTIVE" = "/var/www/celebration/releases/github-$SHORT"
          cd "$ACTIVE"
          # Env is loaded only in the Node process, never echoed to Actions.
          timeout 1800 node -e 'const { loadEnvConfig } = require("@next/env"); loadEnvConfig(process.cwd(), false); process.argv.push("--apply", "--allow-partial"); import("./scripts/rehost-meesho-catalog-images.mjs").catch(err => { console.error("Catalog migration failed:", err.message); process.exitCode = 1 })'
          REMOTE
