name: Diagnose Packing Video Upload

on:
  push:
    branches:
      - ops/diagnose-packing-upload

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/celebration_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/celebration_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/celebration_deploy" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Diagnose packing upload read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/celebration_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_ROOT=/var/www/celebration
          ENV_FILE="$APP_ROOT/shared/.env.production"
          ACTIVE="$(readlink -f "$APP_ROOT/current")"
          echo "ACTIVE_RELEASE=$ACTIVE"
          test -f "$ENV_FILE"
          set -a
          . "$ENV_FILE"
          set +a
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -n "${!k:-}" ]; then echo "$k=SET"; else echo "$k=MISSING"; fi
          done

          cd "$ACTIVE"
          node <<'NODE'
const { S3Client, GetBucketCorsCommand, HeadBucketCommand } = require("@aws-sdk/client-s3");
const client = new S3Client({
  region: "auto",
  endpoint: `https://${process.env.R2_ACCOUNT_ID}.r2.cloudflarestorage.com`,
  credentials: { accessKeyId: process.env.R2_ACCESS_KEY_ID, secretAccessKey: process.env.R2_SECRET_ACCESS_KEY }
});
(async () => {
  try {
    await client.send(new HeadBucketCommand({ Bucket: process.env.R2_BUCKET }));
    console.log("R2_BUCKET_ACCESS=OK");
  } catch (e) {
    console.log("R2_BUCKET_ACCESS=FAIL", e?.name || "Error", e?.$metadata?.httpStatusCode || "");
  }
  try {
    const out = await client.send(new GetBucketCorsCommand({ Bucket: process.env.R2_BUCKET }));
    console.log("R2_CORS="+JSON.stringify(out.CORSRules || []));
  } catch (e) {
    console.log("R2_CORS_ERROR="+String(e?.name || e?.Code || "Error")+":"+String(e?.$metadata?.httpStatusCode || ""));
  }
})();
NODE

          echo "RECENT_PACKING_LOGS_BEGIN"
          LOG="/home/$USER/.pm2/logs/celebration-site-error.log"
          if [ -f "$LOG" ]; then
            tail -n 600 "$LOG" | grep -Ei 'packing-video|packing video|admin-packing|upload-service|r2|invalid_video|cors|signature' | tail -n 80 || true
          else
            echo "PM2_ERROR_LOG_NOT_FOUND"
          fi
          echo "RECENT_PACKING_LOGS_END"

          node <<'NODE'
const { Client } = require("pg");
(async () => {
  const sslMode = String(process.env.DATABASE_SSL_MODE || "").toLowerCase();
  const client = new Client({ connectionString: process.env.DATABASE_URL, ssl: sslMode === "require" ? { rejectUnauthorized: false } : undefined });
  try {
    await client.connect();
    const r = await client.query(`
      SELECT public_id, status, (packing_video_key IS NOT NULL) AS has_video, updated_at
      FROM orders
      ORDER BY updated_at DESC
      LIMIT 10
    `);
    for (const row of r.rows) console.log("ORDER_STAGE", row.public_id, row.status, "hasVideo="+row.has_video, row.updated_at.toISOString());
  } catch (e) {
    console.log("ORDER_STAGE_QUERY_ERROR", e?.code || e?.message || "unknown");
  } finally {
    try { await client.end(); } catch {}
  }
})();
NODE
          REMOTE
