name: Diagnose Packing Video Upload

on:
  push:
    branches:
      - ops/diagnose-packing-upload

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/celebration_deploy"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/celebration_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/celebration_deploy" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Diagnose packing upload read-only
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/celebration_deploy" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_ROOT=/var/www/celebration
          ENV_FILE="$APP_ROOT/shared/.env.production"
          ACTIVE="$(readlink -f "$APP_ROOT/current")"
          echo "ACTIVE_RELEASE=$ACTIVE"
          test -f "$ENV_FILE"
          set -a
          . "$ENV_FILE"
          set +a
          for k in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET; do
            if [ -n "${!k:-}" ]; then echo "$k=SET"; else echo "$k=MISSING"; fi
          done
          cd "$ACTIVE"

          node -e 'const {S3Client,PutBucketCorsCommand}=require("@aws-sdk/client-s3"); const c=new S3Client({region:"auto",endpoint:"https://"+process.env.R2_ACCOUNT_ID+".r2.cloudflarestorage.com",credentials:{accessKeyId:process.env.R2_ACCESS_KEY_ID,secretAccessKey:process.env.R2_SECRET_ACCESS_KEY}}); (async()=>{try{await c.send(new PutBucketCorsCommand({Bucket:process.env.R2_BUCKET,CORSConfiguration:{CORSRules:[{AllowedOrigins:["https://shopcelebration.in","https://www.shopcelebration.in"],AllowedMethods:["GET","HEAD","PUT"],AllowedHeaders:["*"],ExposeHeaders:["ETag"],MaxAgeSeconds:3600}]}}));console.log("R2_CORS_APPLY=OK")}catch(e){console.log("R2_CORS_APPLY=FAIL:"+(e.name||"Error")+":"+((e.$metadata&&e.$metadata.httpStatusCode)||""));process.exitCode=4}})()'

          node -e 'const {S3Client,HeadBucketCommand,GetBucketCorsCommand,PutObjectCommand}=require("@aws-sdk/client-s3"); const {getSignedUrl}=require("@aws-sdk/s3-request-presigner"); const c=new S3Client({region:"auto",endpoint:"https://"+process.env.R2_ACCOUNT_ID+".r2.cloudflarestorage.com",credentials:{accessKeyId:process.env.R2_ACCESS_KEY_ID,secretAccessKey:process.env.R2_SECRET_ACCESS_KEY}}); (async()=>{try{await c.send(new HeadBucketCommand({Bucket:process.env.R2_BUCKET}));console.log("R2_BUCKET_ACCESS=OK")}catch(e){console.log("R2_BUCKET_ACCESS=FAIL",e.name,e.$metadata&&e.$metadata.httpStatusCode)} try{const x=await c.send(new GetBucketCorsCommand({Bucket:process.env.R2_BUCKET}));console.log("R2_CORS="+JSON.stringify(x.CORSRules||[]))}catch(e){console.log("R2_CORS_ERROR="+(e.name||"Error")+":"+((e.$metadata&&e.$metadata.httpStatusCode)||""))} const u=await getSignedUrl(c,new PutObjectCommand({Bucket:process.env.R2_BUCKET,Key:"diagnostics/cors-check.mp4",ContentType:"video/mp4"}),{expiresIn:300}); console.log("R2_TEST_URL="+u)})()' > /tmp/r2diag.txt
          grep -v '^R2_TEST_URL=' /tmp/r2diag.txt
          TEST_URL="$(grep '^R2_TEST_URL=' /tmp/r2diag.txt | cut -d= -f2-)"
          for ORIGIN in https://shopcelebration.in https://www.shopcelebration.in; do
            echo "CORS_ORIGIN=$ORIGIN"
            curl --silent --show-error --max-time 15 -X OPTIONS "$TEST_URL" \
              -H "Origin: $ORIGIN" \
              -H "Access-Control-Request-Method: PUT" \
              -H "Access-Control-Request-Headers: content-type" \
              -D - -o /dev/null | grep -Ei 'HTTP/|access-control-allow-origin|access-control-allow-methods|access-control-allow-headers' || true
          done
          rm -f /tmp/r2diag.txt

          echo "RECENT_PACKING_LOGS_BEGIN"
          LOG="/home/$USER/.pm2/logs/celebration-site-error.log"
          if [ -f "$LOG" ]; then
            tail -n 600 "$LOG" | grep -Ei 'packing-video|packing video|admin-packing|upload-service|invalid_video|cors|signature|r2' | tail -n 80 || true
          else
            echo "PM2_ERROR_LOG_NOT_FOUND"
          fi
          echo "RECENT_PACKING_LOGS_END"

          node -e 'const {Client}=require("pg");(async()=>{const ssl=String(process.env.DATABASE_SSL_MODE||"").toLowerCase()==="require"?{rejectUnauthorized:false}:undefined;const c=new Client({connectionString:process.env.DATABASE_URL,ssl});try{await c.connect();const r=await c.query("SELECT public_id,status,(packing_video_key IS NOT NULL) AS has_video,updated_at FROM orders ORDER BY updated_at DESC LIMIT 10");for(const x of r.rows)console.log("ORDER_STAGE",x.public_id,x.status,"hasVideo="+x.has_video,x.updated_at.toISOString())}catch(e){console.log("ORDER_STAGE_QUERY_ERROR",e.code||e.message)}finally{try{await c.end()}catch{}}})()'
          REMOTE
