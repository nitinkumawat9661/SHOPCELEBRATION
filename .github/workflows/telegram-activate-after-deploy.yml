name: Activate Celebration Telegram after healthy production deploy

on:
  workflow_run:
    workflows: ["Deploy Celebration Production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: celebration-telegram-activation
  cancel-in-progress: false

jobs:
  activate:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Connect securely without printing private environment values
        shell: bash
        run: |
          set -euo pipefail
          for var in VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!var:-}" ] || { echo "Missing SSH configuration: $var" >&2; exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/celebration"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/celebration" "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Register private webhook and start exactly one Telegram worker
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/celebration" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" bash -s <<'REMOTE'
          set -euo pipefail
          ROOT=/var/www/celebration
          RELEASE="$(readlink -f "$ROOT/current")"
          case "$RELEASE" in "$ROOT"/releases/github-*) ;; *) echo "Unknown production release"; exit 1 ;; esac
          [ -f "$RELEASE/scripts/telegram-notification-worker.mjs" ] || { echo "Telegram worker file missing; not activating"; exit 1; }
          [ -f "$RELEASE/app/api/integrations/telegram/webhook/route.ts" ] || { echo "Telegram webhook route source missing"; exit 1; }
          [ "$(stat -Lc %a "$ROOT/shared/.env.production")" = "600" ] || { echo "Private env mode is not 0600"; exit 1; }
          export PM2_HOME=/home/nitin/.pm2
          cd "$RELEASE"
          node - <<'NODE'
          const {loadEnvConfig}=require("@next/env")
          loadEnvConfig(process.cwd(),false)
          const {Client}=require("pg")
          const required=["DATABASE_URL","TELEGRAM_BOT_TOKEN","TELEGRAM_ADMIN_CHAT_ID","TELEGRAM_WEBHOOK_SECRET"]
          if(required.some(key=>!process.env[key]))throw Error("Missing private Telegram config")
          if(process.env.TELEGRAM_WEBHOOK_SECRET.length<32)throw Error("Webhook secret too short")
          const db=new Client({connectionString:process.env.DATABASE_URL,
            ssl:process.env.DATABASE_SSL_MODE==="disable"?false:{rejectUnauthorized:true}})
          ;(async()=>{
            await db.connect()
            try{
              const schema=await db.query("SELECT name FROM schema_migrations WHERE name LIKE '10%telegram%' ORDER BY name")
              if(schema.rows.length!==3)throw Error("Telegram migrations 100-102 missing")
              const tables=await db.query("SELECT to_regclass('telegram_notification_outbox') IS NOT NULL AS queue, to_regclass('telegram_order_messages') IS NOT NULL AS messages")
              if(!tables.rows[0].queue||!tables.rows[0].messages)throw Error("Telegram schema incomplete")
              console.log("TELEGRAM_SCHEMA=VERIFIED")
            }finally{await db.end()}
          })().catch(e=>{console.error("Activation gate:",e.message);process.exitCode=1})
          NODE
          # Node migration gate must succeed before any bot action.
          PM2_HOME=/home/nitin/.pm2 pm2 delete celebration-telegram-worker >/dev/null 2>&1 || true
          PM2_HOME=/home/nitin/.pm2 pm2 start "$RELEASE/scripts/telegram-notification-worker.mjs" \
            --name celebration-telegram-worker --cwd "$RELEASE" --interpreter node \
            --node-args="--env-file=$ROOT/shared/.env.production" >/dev/null
          PM2_HOME=/home/nitin/.pm2 pm2 save >/dev/null
          sleep 3
          PM2_HOME=/home/nitin/.pm2 pm2 jlist | node -e 'let x="";process.stdin.on("data",d=>x+=d).on("end",()=>{const l=JSON.parse(x).filter(p=>p.name==="celebration-telegram-worker");if(l.length!==1||l[0].pm2_env.status!=="online")process.exit(1);console.log("TELEGRAM_WORKER=ONLINE_ONE")})'
          # Bot API requests are made inside Node to keep token/secret out of
          # process arguments, shell history and workflow output.
          node - <<'NODE'
          const {loadEnvConfig}=require("@next/env")
          loadEnvConfig(process.cwd(),false)
          ;(async()=>{
            const token=process.env.TELEGRAM_BOT_TOKEN
            const secret=process.env.TELEGRAM_WEBHOOK_SECRET
            const expected="https://shopcelebration.in/api/integrations/telegram/webhook"
            if(!token||!secret)throw Error("Telegram private credentials absent")
            async function call(method,payload){
              const res=await fetch("https://api.telegram.org/bot"+token+"/"+method,{
                method:"POST",headers:{"Content-Type":"application/json"},
                body:JSON.stringify(payload||{}),signal:AbortSignal.timeout(15000)
              })
              const value=await res.json()
              if(!res.ok||!value.ok)throw Error("Telegram API "+method+" rejected configuration")
              return value.result
            }
            await call("setWebhook",{url:expected,secret_token:secret,allowed_updates:["message"]})
            const info=await call("getWebhookInfo")
            if(info.url!==expected)throw Error("Webhook verification mismatch")
            console.log("TELEGRAM_WEBHOOK=CONFIGURED")
            console.log("WEBHOOK_PENDING_UPDATES="+info.pending_update_count)
          })().catch(e=>{console.error("Telegram activation:",e.message);process.exitCode=1})
          NODE
          REMOTE
