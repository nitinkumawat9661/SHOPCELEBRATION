name: Verify Phase 3 Self Build Database Schema

on:
  pull_request:
    branches: [main]
    paths:
      - db/migrations/047_self_build_hamper_draft_architecture.sql
      - db/migrations/048_self_build_owner_confirmed_categories_and_rates.sql
      - db/migrations/049_self_build_category_only_no_sku_mapping.sql
      - db/migrations/050_self_build_category_option_capacity.sql
      - features/admin/AdminSelfBuildManager.tsx
      - scripts/test-phase3-self-build-admin-20261013.mjs
      - lib/server/self-build-admin.ts
      - app/api/admin/self-build/route.ts
      - scripts/test-phase3-self-build-db-contract.mjs
      - .github/workflows/phase3-self-build-db-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: selfbuild_test
          POSTGRES_DB: selfbuild_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGDATABASE: selfbuild_test
      PGUSER: postgres
      PGPASSWORD: selfbuild_test
    steps:
      - uses: actions/checkout@v5
      - name: Verify owner-confirmed PostgreSQL migrations and privacy gates
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
          psql -v ON_ERROR_STOP=1 -c 'CREATE TABLE customer_accounts (id text PRIMARY KEY); CREATE TABLE orders (id text PRIMARY KEY);'
          psql -v ON_ERROR_STOP=1 -f db/migrations/047_self_build_hamper_draft_architecture.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/048_self_build_owner_confirmed_categories_and_rates.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/049_self_build_category_only_no_sku_mapping.sql
          psql -v ON_ERROR_STOP=1 -f db/migrations/050_self_build_category_option_capacity.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE n integer; r record; p integer;
          BEGIN
            SELECT COUNT(*) INTO n FROM self_build_categories WHERE parent_id IS NULL;
            IF n <> 7 THEN RAISE EXCEPTION 'Expected 7 staged top-level categories, found %',n; END IF;
            SELECT COUNT(*) INTO n FROM self_build_categories WHERE parent_id='jewellery';
            IF n <> 8 THEN RAISE EXCEPTION 'Expected 8 owner-confirmed jewellery groups, found %',n; END IF;
            SELECT COUNT(*) INTO n FROM self_build_options;
            IF n <> 13 THEN RAISE EXCEPTION 'Expected 13 variant options, found %',n; END IF;
            IF (SELECT version FROM self_build_configuration WHERE id='primary') <> 4 THEN
              RAISE EXCEPTION 'Owner revision did not bump admin optimistic version';
            END IF;
            IF (SELECT default_catalog_item_budget_paise FROM self_build_configuration WHERE id='primary') <> 6000 THEN
              RAISE EXCEPTION 'Default ₹60 contribution missing';
            END IF;
            IF (SELECT unit_budget_paise FROM self_build_categories WHERE id='bangles') <> 15000 THEN
              RAISE EXCEPTION 'Standalone Bangles ₹150 missing';
            END IF;
            FOR r IN SELECT id,unit_budget_paise,display_order,selection_kind,active
              FROM self_build_categories WHERE parent_id='jewellery' ORDER BY display_order LOOP
              IF r.selection_kind <> 'category' OR r.active IS NOT TRUE THEN
                RAISE EXCEPTION 'All eight jewellery choices must be selectable categories';
              END IF;
              IF r.id IN ('viral-bangles','korean-bangles') THEN
                IF r.unit_budget_paise<>15000 THEN RAISE EXCEPTION '% should be ₹150 per unit',r.id; END IF;
              ELSE
                IF r.unit_budget_paise<>6000 THEN RAISE EXCEPTION '% should be ₹60 per unit',r.id; END IF;
              END IF;
            END LOOP;
            IF (SELECT label FROM self_build_categories WHERE id='premium-feature-necklaces')<>'Premium Feature Necklaces'
              OR (SELECT label FROM self_build_categories WHERE id='premium-necklaces')<>'Premium Necklaces'
              OR (SELECT label FROM self_build_categories WHERE id='necklace-stud-sets')<>'Necklace & Stud Sets'
              OR (SELECT label FROM self_build_categories WHERE id='korean-earrings')<>'Korean Earrings'
              OR (SELECT label FROM self_build_categories WHERE id='indian-trending-earrings')<>'Indian Trending Earrings'
              OR (SELECT label FROM self_build_categories WHERE id='minimal-rings')<>'Minimal Rings'
              OR (SELECT label FROM self_build_categories WHERE id='viral-bangles')<>'Viral Bangles'
              OR (SELECT label FROM self_build_categories WHERE id='korean-bangles')<>'Korean Bangles' THEN
              RAISE EXCEPTION 'Owner-confirmed category labels mismatch';
            END IF;
            IF (SELECT unit_budget_paise FROM self_build_categories WHERE id='personalised-photos')<>5000
              OR (SELECT charge_mode FROM self_build_categories WHERE id='personalised-photos')<>'per_unit' THEN
              RAISE EXCEPTION 'Photos must consume ₹50 per photo';
            END IF;
            FOR r IN SELECT category_id FROM self_build_options GROUP BY category_id LOOP
              IF r.category_id NOT IN ('chocolates','snacks','perfume') THEN RAISE EXCEPTION 'Unexpected size group'; END IF;
              FOR p IN 1..4 LOOP
                -- 1→Mini 200; 2→Medium 400; 3→Large 600; 4→Mega 1000
                IF NOT EXISTS (SELECT 1 FROM self_build_options WHERE category_id=r.category_id
                  AND label=(ARRAY['Mini','Medium','Large','Mega'])[p]
                  AND unit_budget_paise=(ARRAY[20000,40000,60000,100000])[p] AND active) THEN
                  RAISE EXCEPTION '% size % price mismatch',r.category_id,p;
                END IF;
              END LOOP;
            END LOOP;
            IF NOT EXISTS (SELECT 1 FROM self_build_options WHERE id='chocolate-extra-100'
              AND category_id='chocolates' AND label='Starter' AND unit_budget_paise=10000 AND active) THEN
              RAISE EXCEPTION 'Chocolate Starter ₹100 missing or inactive';
            END IF;
            IF (SELECT customer_enabled OR show_item_prices FROM self_build_configuration WHERE id='primary') THEN
              RAISE EXCEPTION 'Staging customer and internal price visibility gates must remain closed';
            END IF;
            IF to_regclass('self_build_catalog_product_rules') IS NOT NULL THEN
              RAISE EXCEPTION 'The SKU mapping structure must be retired';
            END IF;
            IF EXISTS (SELECT 1 FROM information_schema.columns
              WHERE table_name='self_build_categories' AND column_name='catalog_category') THEN
              RAISE EXCEPTION 'The catalogue-category mapping field must be retired';
            END IF;
            IF EXISTS (SELECT 1 FROM self_build_categories WHERE availability_confirmed OR available_units IS NOT NULL)
              OR EXISTS (SELECT 1 FROM self_build_options WHERE availability_confirmed OR available_units IS NOT NULL) THEN
              RAISE EXCEPTION 'Never seed fictional fulfilment stock';
            END IF;
            IF (SELECT selection_kind FROM self_build_categories WHERE id='bangles') <> 'category' THEN
              RAISE EXCEPTION 'Standalone bangles must also be category-only';
            END IF;
            BEGIN
              UPDATE self_build_configuration SET customer_enabled=true WHERE id='primary';
              RAISE EXCEPTION 'UNSAFE: customer feature enabled without inventory integration';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE self_build_configuration SET show_item_prices=true WHERE id='primary';
              RAISE EXCEPTION 'UNSAFE: private internal budget exposed to customers';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $$;
          -- The rate itself is dynamic: admin can update it without a new deploy.
          UPDATE self_build_categories SET unit_budget_paise=7500 WHERE id='premium-necklaces';
          UPDATE self_build_options SET unit_budget_paise=70000 WHERE id='chocolate-large';
          DO $$
          BEGIN
            IF (SELECT unit_budget_paise FROM self_build_categories WHERE id='premium-necklaces')<>7500
              OR (SELECT unit_budget_paise FROM self_build_options WHERE id='chocolate-large')<>70000 THEN
              RAISE EXCEPTION 'Pricing values must remain admin-editable in the database';
            END IF;
          END $$;
          -- Category-level capacity can be confirmed by an owner without SKU mapping.
          UPDATE self_build_categories SET availability_confirmed=true, available_units=11 WHERE id='korean-bangles';
          UPDATE self_build_options SET availability_confirmed=true, available_units=3 WHERE id='chocolate-extra-100';
          DO $capacity_validate$
          BEGIN
            IF (SELECT available_units FROM self_build_categories WHERE id='korean-bangles') <> 11
              OR (SELECT available_units FROM self_build_options WHERE id='chocolate-extra-100') <> 3 THEN
              RAISE EXCEPTION 'Admin capacity planning did not persist';
            END IF;
            BEGIN
              UPDATE self_build_categories SET availability_confirmed=false WHERE id='korean-bangles';
              RAISE EXCEPTION 'Unconfirmed capacity must be NULL';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
            BEGIN
              UPDATE self_build_options SET available_units=-5 WHERE id='chocolate-extra-100';
              RAISE EXCEPTION 'Negative capacity must not persist';
            EXCEPTION WHEN check_violation THEN NULL;
            END;
          END $capacity_validate$;
          -- Category/option quantity amounts remain editable; zero product IDs.
          UPDATE self_build_categories SET unit_budget_paise=15000 WHERE id='viral-bangles';
          DELETE FROM self_build_options;
          DELETE FROM self_build_categories;
          SQL
          echo 'Postgres 16: 047 + 048 + 049 + category-capacity 050; stock defaults unconfirmed, verified counts persisted, no SKU mapping and private gates passed.'
