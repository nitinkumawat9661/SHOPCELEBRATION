name: Verify Celebration Image Ownership

on:
  workflow_run:
    workflows:
      - Deploy Celebration Production
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: celebration-image-provenance
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Verify Celebration image fallbacks')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Configure verified SSH access
        shell: bash
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_PRIVATE_KEY VPS_KNOWN_HOSTS; do
            [ -n "${!name:-}" ] || { echo "Missing required value: $name" >&2; exit 1; }
          done
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/image_review"
          printf '%s\n' "$VPS_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/image_review" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/image_review" >/dev/null
          ssh-keygen -F "$VPS_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Four ownership checks and atomic fallback backfill
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -i "$HOME/.ssh/image_review" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" bash -s -- "$DEPLOYED_SHA" <<'REMOTE'
          set -euo pipefail
          test "$(id -un)" = "nitin"
          ACTIVE="$(readlink -f /var/www/celebration/current)"
          SHORT="$(printf '%s' "$1" | cut -c1-12)"
          test "$ACTIVE" = "/var/www/celebration/releases/github-$SHORT"
          cd "$ACTIVE"
          timeout 900 node -e 'const {loadEnvConfig}=require("@next/env");loadEnvConfig(process.cwd(),false);process.argv.push("--apply");import("./scripts/audit-catalog-image-ownership.mjs").catch(err=>{console.error("Ownership review failed:",err.message);process.exitCode=1})'
          REMOTE
