name: Celebration Phase 1 Mobile Browser QA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Celebration Production"]
    types: [completed]

permissions:
  contents: read

jobs:
  actual-mobile-homepage:
    # A post-deploy screenshot reflects the new LIVE version, not the old
    # published revision that still exists while the PR builds.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Check out phase-one QA
        uses: actions/checkout@v5
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Prepare Chromium browser test
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Read-only real Chrome QA of five phone widths
        shell: bash
        env:
          BASE_URL: https://shopcelebration.in/
        run: |
          set -euo pipefail
          node scripts/audit-phase1-live-home-mobile.mjs
      - name: Preserve screenshot contact and JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-home-mobile-screenshots-${{ github.run_id }}
          path: artifacts/phase1-home-mobile/
          if-no-files-found: warn
          retention-days: 14
