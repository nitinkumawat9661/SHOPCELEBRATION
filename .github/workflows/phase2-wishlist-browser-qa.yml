name: Celebration Phase 2 Wishlist Browser QA

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Celebration Production"]
    types: [completed]

permissions:
  contents: read

jobs:
  saved-pieces-qa:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Prepare Chromium
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Real browser wishlist save, refresh, retrieval, tabs and removal
        env:
          BASE_URL: https://shopcelebration.in
        run: |
          node scripts/audit-phase2-live-wishlist.mjs
          node scripts/audit-phase2-multidevice-mock.mjs
      - name: Preserve screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-wishlist-${{ github.run_id }}
          path: artifacts/phase2-wishlist/
          if-no-files-found: warn
          retention-days: 14
