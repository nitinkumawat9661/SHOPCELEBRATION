name: Deploy Admin Change On Merge

on:
  push:
    branches:
      - main
    paths:
      - app/admin/**
      - features/admin/**
      - styles/admin-systematic.css
      - styles/admin-shell.css
      - .github/workflows/deploy-admin-on-merge.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-production:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-production.yml --ref main --repo ${{ github.repository }}
