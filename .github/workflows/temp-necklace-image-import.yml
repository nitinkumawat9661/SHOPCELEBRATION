name: Temporary necklace image import

on:
  push:
    branches:
      - feat/publish-22-necklaces

permissions:
  contents: write

jobs:
  import-images:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/publish-22-necklaces
      - name: Download and validate approved necklace images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/catalog/necklaces
          download() {
            src="$1"
            dst="$2"
            echo "Downloading $dst"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 "$src" -o "$dst"
            test -s "$dst"
            mime="$(file --brief --mime-type "$dst")"
            case "$mime" in
              image/png|image/jpeg|image/webp) ;;
              *) echo "Unexpected MIME $mime for $dst" >&2; exit 1 ;;
            esac
          }
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304498608/ALittleSparkleJewelryAdvertisement.png' 'public/catalog/necklaces/celebration-necklace-001.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499287/CelebrationBowPendantSparkleAd.png' 'public/catalog/necklaces/celebration-necklace-002.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499392/CelebrationFour-HeartNecklaceGiftAd.png' 'public/catalog/necklaces/celebration-necklace-003.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304498767/CelebrationHeartPendantSparkle.png' 'public/catalog/necklaces/celebration-necklace-004.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499212/CelebrationHeart-KeyNecklaceAd.png' 'public/catalog/necklaces/celebration-necklace-005.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304498599/CelebrationMovingStoneNecklaceAd.png' 'public/catalog/necklaces/celebration-necklace-006.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499192/CelebrationMovingStonePendantAd.png' 'public/catalog/necklaces/celebration-necklace-007.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304498365/CelebrationMovingStonePendantAd.pngo.png' 'public/catalog/necklaces/celebration-necklace-008.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499155/CelebrationNecklaceSparkleGiftAd.png' 'public/catalog/necklaces/celebration-necklace-009.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499213/CelebrationNecklace_ALittleSparkle.png' 'public/catalog/necklaces/celebration-necklace-010.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499287/CelebrationNecklace_SpecialMoments.pngoo.png' 'public/catalog/necklaces/celebration-necklace-011.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499354/CelebrationPendant_SparkleforEveryMoment.png' 'public/catalog/necklaces/celebration-necklace-012.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499403/CelebrationSparkleNecklaceAd.png' 'public/catalog/necklaces/celebration-necklace-013.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304498128/CelebrationSparkleNecklaceGiftPoster.png' 'public/catalog/necklaces/celebration-necklace-014.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499363/Celebration_ALittleSparkle.png' 'public/catalog/necklaces/celebration-necklace-015.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499449/ChatGPTImageOct6202609_17_11PM.png' 'public/catalog/necklaces/celebration-necklace-016.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304498999/ChatGPTImageOct6202609_18_02PM.png' 'public/catalog/necklaces/celebration-necklace-017.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499523/ChatGPTImageOct6202609_30_01PM.png' 'public/catalog/necklaces/celebration-necklace-018.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304498154/LuxuryJewelryCelebrationAd.png' 'public/catalog/necklaces/celebration-necklace-019.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304497252/LuxuryMovingCenterStoneNecklace.png' 'public/catalog/necklaces/celebration-necklace-020.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499456/oo.png' 'public/catalog/necklaces/celebration-necklace-021.png'
          download 'https://upload.meeshosupplyassets.com/cataloging/1791304499282/RomanticHeartPendantJewelryAd.png' 'public/catalog/necklaces/celebration-necklace-022.png'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog/necklaces
          git commit -m "Add Celebration necklace product images"
          git push origin HEAD:feat/publish-22-necklaces
