name: Celebration Phase 2 Jewellery Final Browser QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jewelry-final:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install Chrome browser harness
        run: |
          set -euo pipefail
          npm ci
          npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
          command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Verify real storefront filters, listing, gallery, purchase routing and layout
        env:
          BASE_URL: https://shopcelebration.in
        run: node scripts/audit-phase2-jewelry-final-browser.mjs
      - name: Save desktop/mobile QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-jewelry-final-${{ github.run_id }}
          path: artifacts/phase2-jewelry-final/
          if-no-files-found: warn
          retention-days: 14
